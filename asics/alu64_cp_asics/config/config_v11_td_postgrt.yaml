# ============================================================================
# ALU64_CP - LIBRELANE ASIC CONFIGURATION
# ============================================================================

DESIGN_NAME: alu64_cp_top

# ----------------------------------------------------------------------------
# RTL
# ----------------------------------------------------------------------------

VERILOG_FILES:
  - dir::src/alu64_cp_pkg.sv
  - dir::src/alu64_cp_core.sv
  - dir::src/alu64_cp_pipeline.sv
  - dir::src/alu64_cp_top.sv

# ----------------------------------------------------------------------------
# PDK
# ----------------------------------------------------------------------------

PDK: sky130A

STD_CELL_LIBRARY: sky130_fd_sc_hd

# ----------------------------------------------------------------------------
# CLOCK
# ----------------------------------------------------------------------------

CLOCK_PORT: clk

CLOCK_PERIOD: 10.0

# ----------------------------------------------------------------------------
# SYNTHESIS
# ----------------------------------------------------------------------------

SYNTH_STRATEGY: "DELAY 4"

# ----------------------------------------------------------------------------
# TIMING CONSTRAINTS
# ----------------------------------------------------------------------------

PNR_SDC_FILE: dir::constraints/alu64_cp_top.sdc

SIGNOFF_SDC_FILE: dir::constraints/alu64_cp_top.sdc

# ----------------------------------------------------------------------------
# FLOORPLAN
# ----------------------------------------------------------------------------

FP_SIZING: absolute

DIE_AREA:
  - 0
  - 0
  - 350
  - 350

# ============================================================================
# END
# ============================================================================

# EXPERIMENT 3: TIMING-DRIVEN PLACEMENT + POST-GRT TIMING REPAIR
PL_TIMING_DRIVEN: true
GLB_RESIZER_TIMING_OPTIMIZATIONS: true
